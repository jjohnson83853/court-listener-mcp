services:
  # Production service - HTTP transport for network access
  # NOTE: HOST-side ./.data/cache must be owned by the container's non-root UID
  # (chown 1000:1000 ./.data/cache) before first start, or cache chmod 0700/0600 will fail.
  court-listener-mcp:
    image: registry.localdomain:5000/court-listener-mcp:0.2.0
    container_name: court-listener-mcp-server
    command: python -m app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - COURTLISTENER_LOG_LEVEL=INFO
    volumes:
      - ./.data/cache:/app/.cache
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
